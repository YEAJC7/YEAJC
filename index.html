<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YEAJC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND -->
    <div class="stars"></div>
    <div class="noise"></div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <header>

        <div class="logo">
            YE<span>A</span>JC
        </div>

        <nav>

            <button class="nav-link active" data-page="home">
                HOME
            </button>

            <button class="nav-link" data-page="unknown">
                UNKNOWN
            </button>

            <button class="nav-link">
                FILES
            </button>

            <button class="nav-link">
                SIGNAL
            </button>

            <button class="nav-link">
                CONTACT
            </button>

        </nav>

        <button class="menu">
            ☰
        </button>

    </header>


    <!-- SOCIALS -->

    <aside class="socials">

        <div>◎</div>
        <div>◉</div>
        <div>♥</div>

        <span class="follow">
            FOLLOW THE SIGNAL
        </span>

        <div class="purple-line"></div>

    </aside>


    <!-- =========================
         HOME PAGE
    ========================== -->

    <main id="home" class="page active-page">


        <!-- BACKGROUND CHARACTER -->

        <div class="character">

            <div class="head"></div>
            <div class="face"></div>
            <div class="body"></div>

        </div>


        <!-- MAIN CONTENT -->

        <section class="hero">

            <h1 class="glitch" data-text="YEAJC">
                YEAJC
            </h1>

            <p>
                NOT EVERYTHING IS MEANT TO BE
                <span>UNDERSTOOD.</span>
            </p>


            <button class="enter-btn" data-page="unknown">
                ENTER
            </button>


            <div class="arrow">
                ↓
            </div>

        </section>


        <!-- RIGHT SIDE -->

        <div class="scroll-side">

            <span>SCROLL</span>

            <div class="scroll-line">
                <div></div>
            </div>

        </div>


    </main>



    <!-- =========================
         UNKNOWN PAGE
    ========================== -->

    <main id="unknown" class="page">


        <section class="unknown-content">

            <h2>
                UNKNOWN
            </h2>


            <div class="unknown-grid">


                <!-- TERMINAL -->

                <div class="terminal">

                    <div class="terminal-top">

                        <span>
                            > MESSAGE.LOG
                        </span>

                        <div>
                            — &nbsp; ×
                        </div>

                    </div>


                    <div class="terminal-text">

                        <p>
                            There are places on the internet<br>
                            that nobody searches.
                        </p>

                        <p>
                            And yet... here you are.
                        </p>

                        <p>
                            Coincidence?<br>
                            Or was it meant to be?
                        </p>

                        <p>
                            YEAJC is only the beginning.
                        </p>

                        <p class="typing">
                            >_
                        </p>

                    </div>

                </div>



                <!-- SYMBOL AREA -->

                <div class="symbol-box">

                    <div class="symbol-glow"></div>

                    <div class="circle">

                        <div class="eye">

                            <div class="eye-center"></div>

                        </div>

                    </div>

                </div>


            </div>


            <button class="files-btn">

                ACCESS FILES

                <span>
                    ♙
                </span>

            </button>


        </section>

    </main>



    <script src="script.js"></script>

</body>
</html>
